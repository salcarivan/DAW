<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Formulario de contacto y reserva">
    <meta name="author" content="Paraíso Azul">
    <title>Contacto y Reservas - Paraíso Azul</title>
</head>
<body bgcolor="#E0F7FA" text="#003366">

    <center>
        <h1>📝 Formulario de Reserva</h1>
        <h3><i>Completa tus datos y te contactaremos en 24h</i></h3>
        <hr width="70%">
    </center>

    <form action="#" method="post">
        <center>
        <table border="2" cellpadding="10" width="80%" bgcolor="#FFFFFF" bordercolor="#0066CC">

            <tr bgcolor="#FFCC00">
                <th colspan="2"><font color="#003366">Datos Personales</font></th>
            </tr>

            <tr>
                <td><label for="nombre">Nombre:</label></td>
                <td><input type="text" id="nombre" name="nombre" size="30" required></td>
            </tr>

            <tr bgcolor="#F0F8FF">
                <td><label for="apellidos">Apellidos:</label></td>
                <td><input type="text" id="apellidos" name="apellidos" size="50" required></td>
            </tr>

            <tr>
                <td><label for="email">Correo electrónico:</label></td>
                <td><input type="email" id="email" name="email" size="35" required></td>
            </tr>

            <tr bgcolor="#F0F8FF">
                <td><label for="telefono">Teléfono:</label></td>
                <td><input type="tel" id="telefono" name="telefono" size="15"></td>
            </tr>

            <tr bgcolor="#FFCC00">
                <th colspan="2"><font color="#003366">Detalles del Viaje</font></th>
            </tr>

            <tr>
                <td><label for="destino">Destino:</label></td>
                <td>
                    <select id="destino" name="destino" required>
                        <option value="">-- Selecciona un destino --</option>
                        <option value="punta-cana">Punta Cana</option>
                        <option value="bahamas">Bahamas</option>
                        <option value="riviera-maya">Riviera Maya</option>
                        <option value="barbados">Barbados</option>
                    </select>
                </td>
            </tr>

            <tr bgcolor="#F0F8FF">
                <td><label for="personas">Número de personas:</label></td>
                <td><input type="number" id="personas" name="personas" min="1" max="20" value="2"></td>
            </tr>

            <tr>
                <td><b>Tipo de viaje preferido:</b></td>
                <td>
                    <input type="radio" id="relax" name="tipo" value="relax" checked>
                    <label for="relax">Relax / Playa</label><br>
                    <input type="radio" id="aventura" name="tipo" value="aventura">
                    <label for="aventura">Aventura / Excursiones</label><br>
                    <input type="radio" id="cultural" name="tipo" value="cultural">
                    <label for="cultural">Cultural</label><br>
                    <input type="radio" id="lujo" name="tipo" value="lujo">
                    <label for="lujo">Lujo</label>
                </td>
            </tr>

            <tr bgcolor="#F0F8FF">
                <td><b>Servicios adicionales:</b></td>
                <td>
                    <input type="checkbox" id="seguro" name="servicio1" value="seguro">
                    <label for="seguro">Seguro de cancelación (+49€)</label><br>
                    <input type="checkbox" id="spa" name="servicio2" value="spa">
                    <label for="spa">Bono Spa (+99€)</label><br>
                    <input type="checkbox" id="excursion" name="servicio3" value="excursion">
                    <label for="excursion">Excursión extra (+149€)</label><br>
                    <input type="checkbox" id="traslados" name="servicio4" value="traslados">
                    <label for="traslados">Traslados VIP (+79€)</label>
                </td>
            </tr>

            <tr>
                <td><label for="observaciones">Observaciones:</label></td>
                <td>
                    <textarea id="observaciones" name="observaciones" rows="5" cols="50" 
                              placeholder="Cuéntanos cualquier detalle o petición especial..."></textarea>
                </td>
            </tr>

            <tr bgcolor="#FFCC00">
                <td colspan="2" align="center">
                    <input type="submit" value="✅ Enviar reserva">
                    &nbsp;&nbsp;&nbsp;
                    <input type="reset" value="🗑️ Borrar">
                </td>
            </tr>

        </table>
        </center>
    </form>

    <br>
    <center>
        <p><a href="index.html" target="_top"><b>🏠 Volver a la página principal</b></a></p>
    </center>

    <hr>
    <footer>
        <center>
            <p><i>© 2026 Paraíso Azul - info@paraisoazul.com</i></p>
        </center>
    </footer>

</body>
</html>
